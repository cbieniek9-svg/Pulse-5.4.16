<body data-pulse-surface="tv" class="pulse-bridge">
    <div class="dashboard pulse-bridge-shell" id="tgp-tv-root" data-pulse-bridge-shell>
        <header class="header">
            <h1 class="header-title" id="tv-store-title">TGP CENTER STORE</h1>
            <div class="header-kpis" id="tv-kpis"></div>
            <div class="header-info">
                <span>—</span><span>—</span><span>—</span>
            </div>
        </header>
        <div id="tv-comms-pinned" class="tv-comms-pinned-wrap" style="display:none;"></div>
        <main class="main-content" id="main">
            <div class="col col-left">
                <div class="task-map-container centric">
                    <div id="tv-fifo-aisle-assignments" class="tv-fifo-assignments"></div>
                    <svg viewBox="0 -10 1200 780" class="tactical-svg large" id="tv-map-svg"></svg>
                    <div id="map-legend" class="map-legend"></div>
                </div>
            </div>
            <div class="col col-center condensed" id="tv-col-center"></div>
            <div class="col col-right">
                <div id="tv-col-right-secondary"></div>
            </div>
        </main>
        <div class="ticker-wrap" id="tv-ticker-wrap" style="display:none;">
            <div class="ticker" id="tv-ticker"></div>
        </div>
    </div>
    <script src="/public/js/comms-center-client.js" defer></script>
    <script src="/public/tv/tv-dashboard.js" defer></script>
    <script src="/public/tv/tv-overrides.js" defer></script>
